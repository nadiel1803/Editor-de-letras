<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Letras</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
</head>
<body data-theme="light">

    <div class="container">
        <aside>
            <div class="top">
                <div class="logo">
                    <h2>Editor<span class="primary">Holyrics</span></h2>
                </div>
            </div>

            <div class="sidebar">
                <a href="#" class="active" id="nav-dashboard">
                    <span class="material-icons-sharp">dashboard</span>
                    <h3>Dashboard</h3>
                </a>
                <a href="#" id="nav-editor">
                    <span class="material-icons-sharp">edit_note</span>
                    <h3>Novo/Editar</h3>
                </a>
                <a href="#" id="nav-musicas">
                    <span class="material-icons-sharp">music_note</span>
                    <h3>Músicas</h3>
                </a>
                <a href="#" id="nav-pastas">
                    <span class="material-icons-sharp">folder</span>
                    <h3>Pastas</h3>
                </a>
                </div>
        </aside>

        <main>
            <div class="theme-switcher">
                <span class="material-icons-sharp active">light_mode</span>
                <label class="theme-toggle-switch">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider round"></span>
                </label>
                <span class="material-icons-sharp">dark_mode</span>
            </div>

            <div class="page-content" id="dashboard-page">
                <h1>Dashboard</h1>
                <div class="stats-cards">
                    <div class="card">
                        <span class="material-icons-sharp">music_note</span>
                        <div class="info">
                            <h3>Músicas</h3>
                            <h1 id="music-count">0</h1>
                        </div>
                    </div>
                    <div class="card">
                        <span class="material-icons-sharp">folder</span>
                        <div class="info">
                            <h3>Pastas</h3>
                            <h1 id="folder-count">0</h1>
                        </div>
                    </div>
                    <div class="card">
                        <span class="material-icons-sharp">bar_chart</span>
                        <div class="info">
                            <h3>Edições Hoje</h3>
                            <h1>0</h1>
                        </div>
                    </div>
                </div>

                <div class="recent-songs">
                    <h2>Músicas Recentes</h2>
                    <ul id="recent-songs-list">
                        <li>Nenhuma música recente</li>
                    </ul>
                </div>
            </div>

            <div class="page-content" id="editor-page" style="display: none;">
                <h1>Editor de Letras</h1>
                <div class="editor-container">
                    <input type="text" id="song-title" placeholder="Digite o título da música...">
                    <textarea id="lyrics-editor" placeholder="Cole a letra da música aqui e pressione 'Enter' para criar novos slides..."></textarea>
                    
                    <div class="editor-actions">
                        <button id="save-to-firebase" class="btn btn-primary">
                            <span class="material-icons-sharp">save</span>
                            Salvar na Nuvem
                        </button>
                        <button id="download-txt" class="btn">
                            <span class="material-icons-sharp">download</span>
                            Baixar .txt
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" type="module"></script>

    <script src="firebase.js" type="module"></script>
    <script src="app.js" type="module"></script>
</body>
</html>
